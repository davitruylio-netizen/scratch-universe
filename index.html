<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiverso de Jogos Scratch</title>
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: #16192b;
      --accent-color: #4e54c8;
      --accent-hover: #8f94fb;
      --text-color: #ffffff;
      --text-dim: #a0a5c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      color: #e0e0e0;
      margin-bottom: 1.5rem;
    }

    .search-box {
      max-width: 550px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border-radius: 25px;
      border: none;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .search-box button {
      background-color: #16192b;
      color: white;
      border: 2px solid #8f94fb;
      padding: 0.8rem 1.5rem;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .search-box button:hover {
      background-color: var(--accent-hover);
      color: #0b0d17;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex-grow: 1;
      width: 100%;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--accent-color);
      display: inline-block;
      padding-bottom: 5px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(143, 148, 251, 0.4);
    }

    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #000;
    }

    .game-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .game-info h3 {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-play {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
      margin-top: auto;
    }

    .btn-play:hover {
      background-color: var(--accent-hover);
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-dim);
      font-size: 1.1rem;
      padding: 3rem 0;
    }

    /* Modal Player */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background-color: var(--card-bg);
      border-radius: 12px;
      width: 100%;
      max-width: 860px;
      padding: 1.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: white;
    }

    .iframe-container {
      width: 100%;
      height: 0;
      padding-bottom: 70%;
      position: relative;
      margin-top: 1rem;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #080910;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Universo Scratch 🚀</h1>
    <p>Explore jogos populares ou digite o ID/Nome de um projeto</p>
    <form class="search-box" onsubmit="handleSearch(event)">
      <input type="text" id="searchInput" placeholder="Digite o nome (ex: Minecraft, Sonic) ou ID do jogo..." required>
      <button type="submit">Pesquisar</button>
    </form>
  </header>

  <main>
    <h2 class="section-title" id="sectionTitle">Jogos Populares em Destaque</h2>
    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeGame()">&times;</span>
      <h2 id="modalTitle">Carregando Jogo...</h2>
      <div class="iframe-container">
        <iframe id="scratchPlayer" src="" frameborder="0" allowfullscreen="true"></iframe>
      </div>
    </div>
  </div>

  <footer>
    <p>Multiverso Scratch &copy; 2026 - Conectado via TurboWarp Player</p>
  </footer>

  <script>
    // Lista base de jogos clássicos confiáveis
    const defaultGames = [
      { id: "10128407", title: "Paper Minecraft" },
      { id: "60917032", title: "Geometry Dash Scratch" },
      { id: "276660763", title: "Appel v1.4" },
      { id: "13854124", title: "Flappy Bird Original" },
      { id: "504268153", title: "Super Mario Bros" },
      { id: "414768396", title: "Minecraft 3D" },
      { id: "140502396", title: "Sonic the Hedgehog" },
      { id: "300305364", title: "Pac-Man" }
    ];

    const gamesGrid = document.getElementById('gamesGrid');
    const modal = document.getElementById('gameModal');
    const scratchPlayer = document.getElementById('scratchPlayer');
    const modalTitle = document.getElementById('modalTitle');

    document.addEventListener('DOMContentLoaded', () => {
      renderGames(defaultGames);
    });

    function handleSearch(event) {
      event.preventDefault();
      const input = document.getElementById('searchInput').value.trim();
      
      // Se for apenas números, abre direto o ID digitado
      if (/^\d+$/.test(input)) {
        openGame(input, `Jogo #${input}`);
        return;
      }

      // Se for texto, filtra os jogos da lista
      const filtered = defaultGames.filter(g => g.title.toLowerCase().includes(input.toLowerCase()));
      if (filtered.length > 0) {
        renderGames(filtered);
      } else {
        // Se não achou na lista base, tenta abrir como busca direta
        gamesGrid.innerHTML = `<div class="status-msg">Pesquisando por "${input}"... Clique abaixo para testar diretamente:</div>`;
        const customCard = document.createElement('div');
        customCard.className = 'game-card';
        customCard.onclick = () => openGame(input, input);
        customCard.innerHTML = `
          <img src="https://scratch.mit.edu/images/scratch-og.png" alt="${input}">
          <div class="game-info">
            <h3>${input}</h3>
            <button class="btn-play">Jogar / Abrir</button>
          </div>
        `;
        gamesGrid.appendChild(customCard);
      }
    }

    function renderGames(list) {
      gamesGrid.innerHTML = '';
      list.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openGame(game.id, game.title);

        const thumbnail = `https://uploads.scratch.mit.edu/projects/thumbnails/${game.id}.png`;

        card.innerHTML = `
          <img src="${thumbnail}" alt="${game.title}" onerror="this.src='https://scratch.mit.edu/images/scratch-og.png'">
          <div class="game-info">
            <h3>${game.title}</h3>
            <button class="btn-play">Jogar Agora</button>
          </div>
        `;
        gamesGrid.appendChild(card);
      });
    }

    function openGame(id, title) {
      modalTitle.innerText = title;
      // Player via TurboWarp (sem bloqueios de CORS e com performance turbinada)
      scratchPlayer.src = `https://turbowarp.org/${id}/embed?autoplay=true`;
      modal.style.display = 'flex';
    }

    function closeGame() {
      modal.style.display = 'none';
      scratchPlayer.src = '';
    }

    window.onclick = function(event) {
      if (event.target === modal) {
        closeGame();
      }
    };
  </script>
</body>
</html>
