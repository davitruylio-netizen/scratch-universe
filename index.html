<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiverso de Jogos Scratch</title>
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: #16192b;
      --accent-color: #4e54c8;
      --accent-hover: #8f94fb;
      --text-color: #ffffff;
      --text-dim: #a0a5c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      color: #e0e0e0;
      margin-bottom: 1.5rem;
    }

    .search-container {
      max-width: 500px;
      margin: 0 auto;
    }

    .search-container input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 25px;
      border: none;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex-grow: 1;
      width: 100%;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(143, 148, 251, 0.4);
    }

    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .game-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .game-info h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .game-info p {
      color: var(--text-dim);
      font-size: 0.9rem;
      flex-grow: 1;
      margin-bottom: 1rem;
    }

    .btn-play {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-play:hover {
      background-color: var(--accent-hover);
    }

    /* Modal (Player de jogo) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background-color: var(--card-bg);
      border-radius: 12px;
      width: 100%;
      max-width: 860px;
      padding: 1.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 2rem;
      color: var(--text-dim);
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: white;
    }

    .iframe-container {
      width: 100%;
      height: 0;
      padding-bottom: 78%; /* Proporção aproximada do player do Scratch */
      position: relative;
      margin-top: 1rem;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #080910;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Universo Scratch 🚀</h1>
    <p>Explore e jogue projetos incríveis criados na comunidade</p>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Pesquisar jogo pelo nome..." onkeyup="filterGames()">
    </div>
  </header>

  <main>
    <div class="games-grid" id="gamesGrid">
      <!-- Os jogos serão gerados via JavaScript -->
    </div>
  </main>

  <!-- Modal para Jogar -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeGame()">&times;</span>
      <h2 id="modalTitle">Nome do Jogo</h2>
      <div class="iframe-container">
        <iframe id="scratchPlayer" src="" frameborder="0" allowtransparency="true" allowfullscreen="true"></iframe>
      </div>
    </div>
  </div>

  <footer>
    <p>Multiverso Scratch &copy; 2026 - Conectando Criadores</p>
  </footer>

  <script>
    // LISTA DE JOGOS
    // Para adicionar mais jogos, basta pegar o ID na URL do Scratch (ex: scratch.mit.edu/projects/10128407/)
    const games = [
      {
        id: "10128407",
        title: "Paper Minecraft",
        description: "Uma versão incrível 2D de Minecraft criada totalmente no Scratch.",
        image: "https://uploads.scratch.mit.edu/projects/thumbnails/10128407.png"
      },
      {
        id: "60917032",
        title: "Geometry Dash",
        description: "Desafie seus reflexos nesta recriação do clássico jogo de ritmo.",
        image: "https://uploads.scratch.mit.edu/projects/thumbnails/60917032.png"
      },
      {
        id: "276660763",
        title: "Appel",
        description: "Um dos melhores jogos de plataforma com física fluida do Scratch.",
        image: "https://uploads.scratch.mit.edu/projects/thumbnails/276660763.png"
      },
      {
        id: "13854124",
        title: "Flappy Bird",
        description: "Voe entre os canos e tente fazer a maior pontuação possível.",
        image: "https://uploads.scratch.mit.edu/projects/thumbnails/13854124.png"
      }
    ];

    const gamesGrid = document.getElementById('gamesGrid');
    const modal = document.getElementById('gameModal');
    const scratchPlayer = document.getElementById('scratchPlayer');
    const modalTitle = document.getElementById('modalTitle');

    // Carregar os jogos na página
    function renderGames(gameList) {
      gamesGrid.innerHTML = '';
      if(gameList.length === 0) {
        gamesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim);">Nenhum jogo encontrado.</p>';
        return;
      }

      gameList.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openGame(game.id, game.title);
        card.innerHTML = `
          <img src="${game.image}" alt="${game.title}" onerror="this.src='https://scratch.mit.edu/images/scratch-og.png'">
          <div class="game-info">
            <h3>${game.title}</h3>
            <p>${game.description}</p>
            <button class="btn-play">Jogar Agora</button>
          </div>
        `;
        gamesGrid.appendChild(card);
      });
    }

    // Filtrar jogos pela pesquisa
    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = games.filter(game => 
        game.title.toLowerCase().includes(query) || 
        game.description.toLowerCase().includes(query)
      );
      renderGames(filtered);
    }

    // Abrir o Modal com o Jogo embutido
    function openGame(id, title) {
      modalTitle.innerText = title;
      // Usando o player oficial embed do Scratch
      scratchPlayer.src = `https://scratch.mit.edu/projects/${id}/embed`;
      modal.style.display = 'flex';
    }

    // Fechar o Modal
    function closeGame() {
      modal.style.display = 'none';
      scratchPlayer.src = ''; // Interrompe o áudio/execução do jogo ao fechar
    }

    // Fechar ao clicar fora do conteúdo
    window.onclick = function(event) {
      if (event.target === modal) {
        closeGame();
      }
    };

    // Inicializa a renderização
    renderGames(games);
  </script>
</body>
</html>
