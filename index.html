<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Universe</title>
  <style>
    body {
      margin: 0;
      background: #080b19;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 25px;
      border-bottom: 1px solid #26304d;
    }

    h1 {
      font-size: 42px;
      color: #71d5ff;
    }

    .search {
      margin: 60px auto;
      max-width: 600px;
      padding: 20px;
    }

    input {
      width: 85%;
      padding: 17px;
      border-radius: 12px;
      border: 1px solid #526a9c;
      background: #141d35;
      color: white;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 15px 35px;
      border: none;
      border-radius: 10px;
      background: #168cff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .welcome {
      color: #aab8d6;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌌 SCRATCH UNIVERSE</h1>
    <p>Um universo inteiro de jogos.</p>
  </header>

  <main class="search">
    <h2>Encontre seu próximo jogo</h2>
    <p class="welcome">
      Milhares de aventuras esperam por você.
    </p>

    <input
      type="text"
      placeholder="Digite o nome ou ID de um jogo..."
    >

    <br>

    <button>EXPLORAR UNIVERSO</button>
  </main>

</body>
</html>
